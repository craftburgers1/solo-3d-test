<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솔로운영 3D · 매장 카운터</title>
<meta name="theme-color" content="#07090c">
<meta name="description" content="드래그해 돌려보고 물건을 눌러보는 3D 매장 카운터 가계부 시제품">
<link rel="icon" href="data:,">
<style>
:root{
  --cyan:#62d3e3; --cyan-d:rgba(98,211,227,.35); --amber:#f0b25e;
  --glass:rgba(16,20,26,.58); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#e9eef3; --muted:#8d98a5; --red:#ff8a7a; --green:#83e0ac;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:#07090c;color:var(--text);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);border:1px solid var(--line)}

#stage{position:fixed;inset:0;opacity:0;transition:opacity 1s ease}
#stage.ready{opacity:1}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

/* 로딩 / 폴백 */
#loader,#fallback{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;background:#07090c;transition:opacity .6s ease}
#loader.hide{opacity:0;pointer-events:none}
#loader p,#fallback p{color:var(--muted);font-size:14px;text-align:center;line-height:1.6;padding:0 24px}
#fallback b{color:var(--text);font-size:16px}
.spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.08);border-top-color:var(--cyan);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}

/* HUD */
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;pointer-events:none}
#hud>*{pointer-events:auto}
.mark{font-size:12px;font-weight:600;letter-spacing:.14em;color:#c9d2db;display:flex;align-items:center;gap:8px;white-space:nowrap;justify-self:start}
.mark i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.hudbar{display:flex;align-items:center;border-radius:14px;padding:7px 7px 7px 4px;min-width:0}
.stat{flex:1 1 0;min-width:0;padding:0 16px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.stat b{font-size:18px;font-weight:600;white-space:nowrap;transition:color .3s,text-shadow .3s}
.stat b.bump{color:#fff;text-shadow:0 0 14px var(--cyan)}
#hNet.pos{color:var(--green)} #hNet.neg{color:var(--red)}
.viewbtn em{font-style:normal}
.viewbtn{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);font-size:12px;color:#cfd7df;white-space:nowrap;transition:background .2s,border-color .2s}
.viewbtn:hover,.viewbtn:focus-visible{background:rgba(98,211,227,.1);border-color:var(--cyan-d);outline:none}

/* 3D 라벨 */
#labels,#fx{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform;transition:opacity .3s}
.lbl .pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;color:#eef3f7;border:1px solid rgba(98,211,227,.22);
  background:rgba(14,18,24,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,border-color .25s,background .25s;transform-origin:50% 100%}
.lbl .pill small{font-size:11px;font-weight:500;color:var(--cyan);opacity:.9}
.lbl .pill::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);background:inherit;border-right:1px solid rgba(98,211,227,.22);border-bottom:1px solid rgba(98,211,227,.22)}
.lbl .pill{position:relative}
.lbl.small .pill{font-size:12px;padding:5px 9px;opacity:.85}
.lbl.hot .pill{transform:scale(1.1);border-color:var(--cyan);background:rgba(20,40,48,.78);box-shadow:0 0 0 3px rgba(98,211,227,.12),0 0 22px rgba(98,211,227,.35)}
.lbl.dim{opacity:.28}
.lbl.off{opacity:0;pointer-events:none}
.lbl .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

/* 이펙트 텍스트 / 말풍선 */
.ftext{position:absolute;left:0;top:0;font-size:22px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 0 16px rgba(240,178,94,.8),0 2px 0 rgba(0,0,0,.3);will-change:transform,opacity}
.ftext.cool{text-shadow:0 0 16px rgba(98,211,227,.9),0 2px 0 rgba(0,0,0,.3)}
#bubble{position:absolute;left:0;top:0;max-width:230px;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;color:#f1f5f8;pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform}
#bubble.show{opacity:1}
#bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:rgba(16,20,26,.8);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#bubble b{color:var(--amber)}

/* 패널 */
#panel{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 78px);right:16px;bottom:16px;width:360px;border-radius:18px;display:flex;flex-direction:column;
  transform:translateX(calc(100% + 30px));opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .3s;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#panel.open{transform:none;opacity:1}
.grab{display:none}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 10px}
.ptag{font-size:11px;letter-spacing:.12em;color:var(--cyan);margin-bottom:4px}
.phead h2{font-size:18px;font-weight:600}
#pClose{width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--line2);font-size:14px;color:#cdd5dd}
#pClose:hover{background:rgba(255,255,255,.06)}
.pbody{flex:1;overflow:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.card{border:1px solid var(--line);border-radius:12px;padding:9px 8px 8px;background:rgba(255,255,255,.025);min-width:0}
.card span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.card b{display:block;font-size:13px;letter-spacing:-.02em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{margin:6px 0 16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,rgba(98,211,227,.07),rgba(255,255,255,.01))}
.big span{font-size:12px;color:var(--muted)}
.big b{display:block;font-size:26px;font-weight:650;margin-top:2px}
.big em{font-style:normal;font-size:12px;color:var(--muted)}
.sec{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:4px 0 6px;display:flex;justify-content:space-between}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.row .l{display:flex;align-items:center;gap:8px;min-width:0}
.row .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12px;color:var(--muted);white-space:nowrap}
.row b{font-weight:600;white-space:nowrap}
.row.new{animation:rowin .7s ease}
@keyframes rowin{from{background:rgba(98,211,227,.18)}to{background:transparent}}
.row.total{border-bottom:0;font-weight:600}
.row.total b{font-size:16px}
.row.minus b{color:#d6dde4}
.row.net b.pos{color:var(--green)} .row.net b.neg{color:var(--red)}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:#c6cfd8;white-space:nowrap}
.chip.c-매장{border-color:rgba(98,211,227,.4);color:var(--cyan)}
.chip.c-배달{border-color:rgba(240,178,94,.45);color:var(--amber)}
.chip.c-예약{border-color:rgba(180,160,230,.45);color:#c7b6f0}
.empty{font-size:13px;color:var(--muted);padding:14px 2px}
.primary{width:100%;margin-top:14px;height:46px;border-radius:12px;border:1px solid var(--cyan-d);background:rgba(98,211,227,.1);color:#dff7fb;font-size:15px;font-weight:600;transition:background .2s,transform .1s}
.primary:hover{background:rgba(98,211,227,.17)}
.primary:active{transform:scale(.98)}
.form{margin-top:14px;padding:14px;border:1px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.03);animation:fin .3s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.form label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.form .field{margin-bottom:12px}
.form input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.25);padding:0 12px;font-size:18px;outline:none;transition:border-color .2s}
.form input:focus{border-color:var(--cyan)}
.form input.err{border-color:var(--red)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;height:36px;border-radius:9px;border:1px solid var(--line2);font-size:13px;color:#c9d1d9;white-space:nowrap;padding:0 6px}
.seg button.on{border-color:var(--cyan);color:#fff;background:rgba(98,211,227,.14)}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick button{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:#b9c3cd}
.quick button:hover{border-color:var(--line2);color:#fff}
.factions{display:flex;gap:8px;margin-top:4px}
.factions button{flex:1;height:44px;border-radius:11px;font-size:15px;font-weight:600}
.factions .save{background:var(--cyan);color:#06171b}
.factions .cancel{border:1px solid var(--line2);color:#c9d1d9}
.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}

/* 하단 */
#foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:15;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transition:opacity .3s;padding:0 16px}
#foot p{font-size:12.5px;color:#aab4be;text-align:center;line-height:1.45;padding:7px 14px;border-radius:999px;background:rgba(10,13,17,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line)}
#sampleBtn{pointer-events:auto;font-size:11px;color:#6f7a86;padding:4px 8px;border-radius:6px}
#sampleBtn:hover{color:#b6c0ca}
#sampleBtn.warn{color:var(--amber)}
body.panel-open #foot{opacity:0;pointer-events:none}
body.panel-open #foot *{pointer-events:none}

/* 데스크톱 폭에서 패널이 열리면 오른쪽 HUD 여백 */
@media (min-width:720px){
  body.panel-open #hud{right:392px}
}

/* 모바일: 아래 시트 */
@media (max-width:719px){
  #hud{grid-template-columns:1fr;gap:7px;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px)}
  .mark{font-size:11px;padding-left:4px}
  .hudbar{padding:6px 5px 6px 2px;border-radius:12px}
  .stat{padding:0 8px}
  .stat span{font-size:10px}
  .stat b{font-size:13.5px}
  .viewbtn{height:34px;padding:0 9px;font-size:15px}
  .viewbtn em{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:60vh;max-height:60dvh;border-radius:20px 20px 0 0;border-bottom:0;
    transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .grab{display:block;width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:8px auto 0}
  .phead{padding:10px 14px 8px}
  .phead h2{font-size:16px}
  .pbody{padding:2px 14px 16px}
  .card{padding:8px 8px 7px}
  .card b{font-size:13px}
  .big b{font-size:22px}
  .lbl .pill{font-size:12px;padding:5px 9px}
  .lbl .pill small{font-size:10px}
  #foot p{font-size:12px}
}
@media (max-width:340px){ .stat b{font-size:12.5px} .stat{padding:0 6px} }
@media (prefers-reduced-motion:reduce){
  .lbl .dot{animation:none} .spin{animation-duration:2s}
  #panel{transition:opacity .2s}
}
</style>

  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>
<div id="stage" aria-label="3D 매장 카운터"></div>

<header id="hud">
  <div class="mark"><i></i>솔로운영 3D</div>
  <div class="hudbar glass" role="group" aria-label="이번 달 요약">
    <div class="stat"><span>총매출</span><b id="hSales" class="num">₩0</b></div>
    <div class="stat"><span>지출</span><b id="hExp" class="num">₩0</b></div>
    <div class="stat"><span>순익</span><b id="hNet" class="num">₩0</b></div>
    <button id="resetView" class="viewbtn" type="button" aria-label="시점 초기화" title="시점 초기화">🔄<em>시점 초기화</em></button>
  </div>
</header>

<div id="labels"></div>
<div id="fx"><div id="bubble" class="glass" role="status" aria-live="polite"></div></div>

<aside id="panel" class="glass" role="dialog" aria-modal="false" aria-hidden="true" aria-labelledby="pTitle">
  <div class="grab"></div>
  <div class="phead">
    <div><div class="ptag" id="pTag"></div><h2 id="pTitle"></h2></div>
    <button id="pClose" type="button" aria-label="패널 닫기">✕</button>
  </div>
  <div class="pbody" id="pBody"></div>
</aside>

<footer id="foot">
  <p>화면을 드래그해 돌려보고, 물건을 눌러보세요</p>
  <button id="sampleBtn" type="button">↺ 샘플 데이터</button>
</footer>

<div id="loader"><div class="spin"></div><p>솔로운영 3D 불러오는 중…</p></div>
<div id="fallback" hidden><b>3D 화면을 열 수 없어요</b><p id="fallbackMsg">이 기기·브라우저는 WebGL(3D 그래픽)을 지원하지 않아요.<br>최신 크롬·사파리·삼성 인터넷에서 다시 열어 주세요.</p></div>

<script>
// WebGL 지원 확인 + 불러오기 실패 대비 (모듈보다 먼저 실행)
(function(){
  var ok = false;
  try { var c = document.createElement('canvas'); ok = !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) { ok = false; }
  function fail(msg){
    var l = document.getElementById('loader'); if (l) l.hidden = true;
    var f = document.getElementById('fallback'); if (f) f.hidden = false;
    if (msg) document.getElementById('fallbackMsg').innerHTML = msg;
  }
  window.__solo3dFail = fail;
  if (!ok) { window.__solo3dNoGL = true; fail(); return; }
  setTimeout(function(){
    if (!window.__solo3dStarted) fail('3D 엔진을 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.');
  }, 15000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

if (!window.__solo3dNoGL) {
window.__solo3dStarted = true;

/* =========================================================
   1. 데이터 (localStorage: solo3d_v1)
   ========================================================= */
const KEY = 'solo3d_v1';
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = window.matchMedia('(pointer: coarse)').matches;

function kst(d = new Date()) {
  const o = {};
  new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(d).forEach(p => { o[p.type] = p.value; });
  if (o.hour === '24') o.hour = '00';
  return { y: +o.year, m: +o.month, d: +o.day, ym: `${o.year}-${o.month}`, date: `${o.year}-${o.month}-${o.day}`, time: `${o.hour}:${o.minute}` };
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function makeSample() {
  const k = kst();
  const day = n => `${k.ym}-${String(Math.max(1, k.d - n)).padStart(2, '0')}`;
  return {
    v: 1,
    sales: [
      [6, '11:40', 412000, '매장'], [5, '19:20', 186500, '배달'], [4, '12:10', 240000, '예약'],
      [3, '20:30', 468000, '매장'], [2, '18:50', 351500, '배달'], [1, '13:05', 584000, '매장']
    ].map(([n, time, amount, channel]) => ({ id: uid(), date: day(n), time, amount, channel })),
    ingredients: [
      [6, '채소', 38000], [5, '육류', 120000], [4, '빵·유제품', 64000], [2, '소스·양념', 32000], [1, '음료', 45000]
    ].map(([n, name, amount]) => ({ id: uid(), date: day(n), name, amount })),
    fixed: [
      { name: '임차료', amount: 1200000 }, { name: '공과금(전기·수도)', amount: 180000 },
      { name: '통신비', amount: 55000 }, { name: '세금과공과', amount: 90000 }
    ]
  };
}
function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && Array.isArray(d.sales) && Array.isArray(d.ingredients) && Array.isArray(d.fixed)) return d;
  } catch (e) { /* 무시하고 샘플 사용 */ }
  const s = makeSample(); saveData(s); return s;
}
function saveData(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* 저장 불가(사생활 모드 등) */ } }
let DATA = loadData();

const sum = a => a.reduce((s, x) => s + (Number(x.amount) || 0), 0);
function month() {
  const k = kst();
  const sales = DATA.sales.filter(x => String(x.date).startsWith(k.ym));
  const ing = DATA.ingredients.filter(x => String(x.date).startsWith(k.ym));
  const s = sum(sales), i = sum(ing), f = sum(DATA.fixed);
  return { k, sales, ing, s, i, f, exp: i + f, net: s - i - f, today: sum(DATA.sales.filter(x => x.date === k.date)) };
}
const won = n => (n < 0 ? '-' : '') + '₩' + Math.abs(Math.round(n)).toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = date => { const p = String(date).split('-'); return p.length === 3 ? `${+p[1]}/${+p[2]}` : ''; };
const recent = arr => arr.slice().sort((a, b) => (b.date + (b.time || '') + b.id).localeCompare(a.date + (a.time || '') + a.id)).slice(0, 5);

/* =========================================================
   2. 렌더러 · 장면 · 카메라
   ========================================================= */
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  window.__solo3dFail && window.__solo3dFail();
  throw e;

const hfovTan = () => Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect;
function fitDist(base, halfW) { return Math.max(base, halfW / hfovTan()); }

function visibleFrac() { // 모바일 시트가 열렸을 때 3D가 보이는 세로 비율
  if (!isSheet() || !active) return 1;

}

  const d = Math.max(fitDist(f.dist, f.fit), (f.hh || 0) / vt);

}
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

const parts = [];
const CB = { x0: -1.9, x1: 1.4, z0: -0.5, z1: 0.5 }; // 카운터 윗면 범위
function burstMoney(amount) {
  const origin = V3(0.55, COUNTER_TOP + 0.18, 0.12);
  const nCoin = 7 + Math.min(9, Math.floor(amount / 40000)), nBill = 2 + Math.min(5, Math.floor(amount / 90000));
  const spawn = (geo, mat, half, k) => {
    const m = new THREE.Mesh(geo, mat); m.castShadow = !COARSE; m.position.copy(origin).add(V3((Math.random() - 0.5) * 0.12, 0, (Math.random() - 0.5) * 0.1));
    m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3); scene.add(m);
    parts.push({ m, half, v: V3((Math.random() - 0.5) * 1.6, 2.2 + Math.random() * 1.4, 0.4 + Math.random() * 0.9), w: V3((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 14), age: 0, life: 1.9 + Math.random() * 0.5, k, settled: false });
  };
  for (let i = 0; i < nCoin; i++) spawn(coinGeo, goldM, 0.006, 'coin');
  for (let i = 0; i < nBill; i++) spawn(billGeo, billM, 0.002, 'bill');
  spawn(receiptGeo, receiptM, 0.001, 'receipt');
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.age += dt;
    if (!p.settled) {
      const drag = p.k === 'coin' ? 1 : 0.35; // 지폐·영수증은 팔랑팔랑
      p.v.y -= 9.8 * drag * dt; p.v.multiplyScalar(p.k === 'coin' ? 1 : 1 - 1.2 * dt);
      p.m.position.addScaledVector(p.v, dt);
      p.m.rotation.x += p.w.x * dt; p.m.rotation.y += p.w.y * dt; p.m.rotation.z += p.w.z * dt;
      const q = p.m.position, onTop = q.x > CB.x0 && q.x < CB.x1 && q.z > CB.z0 && q.z < CB.z1;
      const gy = (onTop ? COUNTER_TOP : 0) + p.half;
      if (q.y < gy && p.v.y < 0 && (onTop ? q.y > COUNTER_TOP - 0.15 : true)) {
        q.y = gy; p.v.y *= -0.32; p.v.x *= 0.55; p.v.z *= 0.55; p.w.multiplyScalar(0.5);
        if (Math.abs(p.v.y) < 0.35) { p.settled = true; p.m.rotation.x = 0; p.m.rotation.z = 0; }
      }
    }
    if (p.age > p.life) {
      const s = 1 - (p.age - p.life) / 0.4;

      p.m.scale.setScalar(s);
    }
  }
}

/* ---- 냉장고 문 / 금고 서랍 애니메이션 ---- */
const anim = { door: 0, doorFrom: 0, doorTo: 0, doorS: 0, drawer: 0, drawerFrom: 0, drawerTo: 0, drawerS: 0 };
let sparkleAt = 0;
function fridgeOpen(on) {
  anim.doorFrom = anim.door; anim.doorTo = on ? 1 : 0; anim.doorS = performance.now();
  if (on) sparkleAt = performance.now() + (RM ? 0 : 380);
}
function drawerOpen(on) { anim.drawerFrom = anim.drawer; anim.drawerTo = on ? 1 : 0; anim.drawerS = performance.now(); }
function stepAnims(now) {
  // 문: 열 때 0.8초 ease-out(살짝 튕김), 닫을 때 0.6초
  const dOpen = anim.doorTo > anim.doorFrom, dd = dOpen ? 800 : 600;
  const td = Math.min(1, (now - anim.doorS) / dd);
  anim.door = anim.doorFrom + (anim.doorTo - anim.doorFrom) * (dOpen ? easeBack(td) : easeIO(td));
  const a = 1.75 * anim.door;
  doorL.rotation.y = -a; doorR.rotation.y = a;
  const lit = Math.max(0, Math.min(1, anim.door));
  fridgeLight.intensity = 4.5 * lit; inner.emissiveIntensity = 0.55 * lit;
  if (sparkleAt && now >= sparkleAt) { fridgeItems.forEach((m, j) => { m.userData.popT = now + j * 55; }); sparkleAt = 0; }
  const tr = Math.min(1, (now - anim.drawerS) / 650);
  anim.drawer = anim.drawerFrom + (anim.drawerTo - anim.drawerFrom) * (anim.drawerTo > anim.drawerFrom ? easeBack(tr) : easeIO(tr));
  drawer.position.z = 0.31 + 0.3 * anim.drawer;
  // 식자재 반짝/등장
  fridgeItems.forEach(m => {
    const u = m.userData; let s = 1, ei = 0;
    if (u.spawnT > 0) {
      const t = (now - u.spawnT) / 650;
      if (t >= 1) { u.spawnT = -1; u.popT = now; }
      else { const e = Math.max(0, t); s = Math.max(0.001, easeBack(e)); m.position.y = u.baseY + (1 - easeOut(e)) * 0.3; ei = 0.6 * (1 - e); }
    }
    if (u.spawnT < 0) {
      m.position.y = u.baseY;
      if (u.popT > 0) {
        const t = (now - u.popT) / 520;
        if (t >= 0 && t < 1) { s = 1 + 0.2 * Math.sin(Math.PI * t); ei = 0.75 * (1 - t); m.position.y = u.baseY + 0.05 * Math.sin(Math.PI * t); }
        else if (t >= 1) u.popT = -1;
      }
    }
    m.scale.setScalar(s); m.material.emissiveIntensity = ei;
  });
}

  say(`${todayLine}<br>이번 달 순익 <b>${won(mo.net)}</b><br>${quip}`);
  waveT = performance.now();
  if (!active) { const f = OBJ.owner.focus; flyTo(focusPos(f), f.t, 0.9); ownerReturnAt = performance.now() + 4300; }
}
let ownerReturnAt = 0;
function refreshPos() { const mo = month(); drawPosScreen(mo.today, mo.s); }

/* =========================================================
   8. 라벨 (3D 좌표 → 화면 좌표)
   ========================================================= */
const labelsEl = document.getElementById('labels');
Object.entries(OBJ).forEach(([k, o]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'lbl' + (o.small ? ' small' : '');
  b.innerHTML = `<span class="pill">${o.small ? '' : '<i class="dot"></i>'}${o.label}${o.sub ? ` <small>${o.sub}</small>` : ''}</span>`;
  b.setAttribute('aria-label', o.label.replace(/^\S+\s/, '') + (o.sub ? ' – ' + o.sub : '') + ' 열기');
  b.addEventListener('click', e => { e.stopPropagation(); openPanel(k); });
  b.addEventListener('pointerenter', () => { labelHover = k; });
  b.addEventListener('pointerleave', () => { if (labelHover === k) labelHover = null; });
  labelsEl.appendChild(b); o.el = b;
});
let labelHover = null;
const tmpV = new THREE.Vector3();
function project(world) {
  tmpV.copy(world).project(camera);
  return { x: (tmpV.x * 0.5 + 0.5) * innerWidth, y: (-tmpV.y * 0.5 + 0.5) * innerHeight, vis: tmpV.z < 1 && tmpV.z > -1 };
}
function updateOverlays(now) {
  Object.entries(OBJ).forEach(([k, o]) => {
    const p = project(o.anchor);
    const hw = (o.el.offsetWidth || 90) / 2 + 4, lx = Math.min(Math.max(p.x, hw), innerWidth - hw);
    o.el.style.transform = `translate3d(${lx.toFixed(1)}px,${p.y.toFixed(1)}px,0) translate(-50%,calc(-100% - 6px))`;
    o.el.classList.toggle('off', !p.vis || (active === k));
    o.el.classList.toggle('dim', !!active && active !== k);
    o.el.classList.toggle('hot', hover === k || labelHover === k);
  });
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i], t = (now - f.s) / f.d;
    if (t >= 1) { f.el.remove(); floats.splice(i, 1); continue; }
    tmpV.copy(f.p); tmpV.y += easeOut(t) * 0.55;
    const p = project(tmpV), sc = t < 0.15 ? 0.6 + t / 0.15 * 0.5 : 1.1 - (t - 0.15) * 0.15;
    f.el.style.transform = `translate3d(${p.x}px,${p.y}px,0) translate(-50%,-50%) scale(${sc})`;
    f.el.style.opacity = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
  }
  if (bubble.classList.contains('show')) {
    if (now > bubbleUntil) bubble.classList.remove('show');
    const head = new THREE.Vector3(); headAnchor.getWorldPosition(head);
    const p = project(head);
    const bw = (bubble.offsetWidth || 200) / 2 + 6, bx = Math.min(Math.max(p.x, bw), innerWidth - bw);
    const by = Math.max(p.y, document.getElementById('hud').getBoundingClientRect().bottom + bubble.offsetHeight + 20);
    bubble.style.transform = `translate3d(${bx}px,${by}px,0) translate(-50%,calc(-100% - 10px))`;
  }
}
const headAnchor = new THREE.Object3D(); headAnchor.position.set(0, 0.42, 0); head.add(headAnchor);

/* =========================================================
   9. 포인터 (드래그와 클릭 구분, 호버)
   ========================================================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hover = null, downAt = null;
function pick(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(PICKABLE, true);
  for (const h of hits) { let o = h.object; while (o && !o.userData.key) o = o.parent; if (o && o.userData.key) return o.userData.key; }
  return null;
}
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; });
cv.addEventListener('pointerup', e => {
  if (!downAt || downAt.id !== e.pointerId) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y), dt = performance.now() - downAt.t; downAt = null;
  if (moved > 7 || dt > 650) return; // 드래그(회전)로 판단
  const k = pick(e.clientX, e.clientY);
  if (k) openPanel(k); else closePanel();
});
cv.addEventListener('pointercancel', () => { downAt = null; });
let hoverXY = null;
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') hoverXY = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerleave', () => { hoverXY = null; hover = null; cv.style.cursor = ''; });

document.getElementById('resetView').addEventListener('click', () => {
  if (active) closePanel(); else flyTo(homePos(), HOME_T, 1.0);
});
const sampleBtn = document.getElementById('sampleBtn');
let sampleArm = 0;
sampleBtn.addEventListener('click', () => {
  const now = performance.now();
  if (now - sampleArm > 3000) { sampleArm = now; sampleBtn.textContent = '한 번 더 누르면 샘플로 되돌려요'; sampleBtn.classList.add('warn');
    setTimeout(() => { if (performance.now() - sampleArm >= 2900) { sampleBtn.textContent = '↺ 샘플 데이터'; sampleBtn.classList.remove('warn'); } }, 3000); return; }
  sampleArm = 0; sampleBtn.textContent = '↺ 샘플 데이터'; sampleBtn.classList.remove('warn');
  DATA = makeSample(); saveData(DATA); syncFridgeItems(); refreshPos(); renderHud(true); if (active) renderPanel();
});

/* =========================================================
   10. 크기 변경 · 루프
   ========================================================= */
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  setCameraFov();
  updateShiftTarget();
  if (!active && !camTween && !userMoved) { camera.position.copy(homePos()); controls.target.copy(HOME_T); }
}
let userMoved = false;
controls.addEventListener('start', () => { userMoved = true; });
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

setCameraFov();
const hp = homePos();
if (RM) { camera.position.copy(hp); }
else { camera.position.copy(HOME_T.clone().addScaledVector(V3(-0.55, 0.75, 1).normalize(), hp.distanceTo(HOME_T) * 1.9)); }
controls.target.copy(HOME_T); controls.update();
syncFridgeItems(); refreshPos(); renderHud(false);
if (!RM) { hudVal.s = hudVal.e = hudVal.n = 0; paintHud(); }

const clock = { last: performance.now(), t: 0 };
const perf = { n: 0, sum: 0, last: performance.now() };
let started = false;
const HL = new THREE.Color(0x62d3e3);
function frame(now) {
  const dt = Math.min(0.05, (now - clock.last) / 1000); clock.last = now; clock.t += dt;
  const T = clock.t;

  if (camTween) {
    const t = Math.min(1, (now - camTween.s) / camTween.d), e = easeIO(t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (t >= 1) { camTween = null; controls.enabled = true; }
  }
  if (ownerReturnAt && now > ownerReturnAt) { ownerReturnAt = 0; if (!active) flyTo(homePos(), HOME_T, 1.0); }
  controls.update();
  applyShift();

  if (hoverXY && !COARSE) {
    const k = pick(hoverXY.x, hoverXY.y);
    if (k !== hover) { hover = k; cv.style.cursor = k ? 'pointer' : ''; }
  }

  // 하이라이트 (emissive + 바닥 링)
  Object.entries(OBJ).forEach(([k, o]) => {
    const target = (hover === k || labelHover === k || active === k) ? 1 : 0;
    o.h += (target - o.h) * Math.min(1, dt * 10);
    o.mats.forEach(m => { if (m === screenMat) return; m.emissive.copy(m.userData.baseEm).lerp(HL, o.h * 0.1); m.emissiveIntensity = Math.max(m.userData.baseEI, o.h * 0.45); });
    if (o.ring) {
      const f = ringFlash[k] || 0;
      o.ring.material.opacity = 0.05 + o.h * 0.5 + f * 0.5 + (RM ? 0 : Math.sin(T * 2.4 + k.length) * 0.03);
      const s = 1 + f * 0.25; o.ring.scale.set(s, s, 1);
      if (ringFlash[k]) ringFlash[k] = Math.max(0, f - dt * 1.4);
    }
  });

  // 포스기 화면 발광
  screenGlow = Math.max(0, screenGlow - dt * 0.9);
  screenMat.emissiveIntensity = 0.9 + screenGlow * 2.2 + OBJ.pos.h * 0.25;

  // 사장님: 호흡 + 손 흔들기
  if (!RM) { body.position.y = Math.sin(T * 2.1) * 0.012; body.scale.y = 1 + Math.sin(T * 2.1) * 0.006; head.rotation.y = Math.sin(T * 0.6) * 0.12; }
  if (waveT > 0) {
    const t = (now - waveT) / 1700;
    if (t >= 1) { waveT = -1; armR.rotation.z = 0.16; armR.rotation.x = -0.25; owner.position.y = 0; head.rotation.z = 0; }
    else {
      const up = t < 0.15 ? easeOut(t / 0.15) : t > 0.85 ? 1 - easeIO((t - 0.85) / 0.15) : 1;
      armR.rotation.z = 0.16 + up * (2.45 + Math.sin(t * 30) * 0.35); armR.rotation.x = -0.25 * (1 - up);
      owner.position.y = Math.abs(Math.sin(t * Math.PI * 2)) * 0.06 * (1 - t);
      head.rotation.z = Math.sin(t * 18) * 0.08 * up;
    }
  }

  // 느린 기기면 해상도를 한 단계 낮춰 프레임 유지
  if (perf.n < 90 && started) { perf.sum += now - perf.last; perf.n++; if (perf.n === 90 && perf.sum / 90 > 22 && renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); } }
  perf.last = now;
  stepAnims(now);
  updateParts(dt);
  stepHud(now);
  renderer.render(scene, camera);
  updateOverlays(now);

  if (!started) {
    started = true;
    document.getElementById('loader').classList.add('hide'); stage.classList.add('ready');
    setTimeout(() => { document.getElementById('loader').hidden = true; }, 700);
    if (!RM) { flyTo(hp, HOME_T, 1.8); setTimeout(() => renderHud(true), 500); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
