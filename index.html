<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솔로운영 3D · 매장 카운터</title>
<meta name="theme-color" content="#f6ead9">
<meta name="description" content="카운터 안쪽 내 자리에서 둘러보는 1인칭 3D 가계부 시제품">
<link rel="icon" href="data:,">
<style>
:root{
  --cream:#fff8ef; --butter:#ffe6a3; --mint:#3fa58a; --mint-l:#bfe9dc; --apricot:#ffc9a3; --coral:#ef8a74; --coral-d:#d9674f;
  --ink:#4a3b30; --muted:#8f7a69; --line:rgba(120,88,60,.13); --line2:rgba(120,88,60,.22);
  --glass:rgba(255,250,243,.8); --pos:#2f9e78; --neg:#dd5e47;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:#f6ead9;color:var(--ink);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.7);box-shadow:0 6px 24px rgba(110,70,40,.12)}
[hidden]{display:none!important}

#stage{position:fixed;inset:0;opacity:0;transition:opacity .9s ease}
#stage.ready{opacity:1}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
#stage canvas.dragging{cursor:grabbing}

#loader,#fallback{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f6ead9;transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}
#loader p,#fallback p{font-size:14px;color:var(--muted);text-align:center;line-height:1.6;padding:0 24px}
#fallback b{font-size:16px}
.blob{width:44px;height:44px;border-radius:50%;background:var(--butter);position:relative;animation:bob 1s ease-in-out infinite alternate}
.blob::before,.blob::after{content:"";position:absolute;top:16px;width:6px;height:8px;border-radius:50%;background:var(--ink)}
.blob::before{left:13px}.blob::after{right:13px}
@keyframes bob{to{transform:translateY(-8px) scale(1.04,.96)}}

/* HUD */
#hud{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;pointer-events:none;transition:right .35s}
#hud>*{pointer-events:auto}
.mark{justify-self:start;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink);padding:6px 11px;border-radius:999px;background:rgba(255,250,243,.7)}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px rgba(239,138,116,.22)}
.hudbar{display:flex;align-items:center;border-radius:18px;padding:7px 7px 7px 4px;min-width:0}
.stat{flex:1 0 auto;min-width:0;padding:0 15px;display:flex;flex-direction:column;gap:1px;border-left:1px dashed var(--line2)}
.stat:first-child{border-left:0}
.stat span{font-size:11px;color:var(--muted);white-space:nowrap}
.stat b{font-size:18px;font-weight:700;white-space:nowrap;transition:transform .25s,color .3s}
.stat b.bump{transform:scale(1.08);color:var(--coral-d)}
#hNet.pos{color:var(--pos)} #hNet.neg{color:var(--neg)}
.homebtn{flex:none;height:38px;padding:0 13px;border-radius:13px;background:var(--butter);font-size:13px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:5px;box-shadow:inset 0 -2px 0 rgba(160,110,30,.18);transition:transform .12s}
.homebtn:active{transform:scale(.95)}
.homebtn em{font-style:normal}

/* 크로스헤어 + 안내 칩 */
#xh{position:fixed;left:50%;top:50%;z-index:12;pointer-events:none;transition:opacity .25s}
#xh .ring{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(90,60,40,.15),0 2px 6px rgba(90,60,40,.18);transition:all .22s cubic-bezier(.3,1.6,.5,1);opacity:.75}
#xh .dot{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(90,60,40,.25);transition:all .2s}
#xh.aim .ring{width:44px;height:44px;margin:-22px 0 0 -22px;border-color:var(--coral);border-width:3px;opacity:1;box-shadow:0 0 0 4px rgba(239,138,116,.18)}
#xh.aim .dot{background:var(--coral);transform:scale(1.3)}
#chip{position:absolute;left:0;top:34px;transform:translateX(-50%) translateY(6px) scale(.9);opacity:0;white-space:nowrap;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;background:#fffaf2;color:var(--ink);box-shadow:0 6px 18px rgba(110,70,40,.18);transition:all .22s cubic-bezier(.3,1.5,.5,1)}
#xh.aim #chip{opacity:1;transform:translateX(-50%) scale(1)}
#chip small{font-weight:600;color:var(--coral-d)}
body.panel-open #xh,body.moving #xh{opacity:0}

/* 오브젝트 배지 / 화면 밖 방향 표시 */
#tags,#fx{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.tg{position:absolute;left:0;top:0;will-change:transform;transition:opacity .25s;pointer-events:auto}
.tg .b{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:rgba(255,250,243,.92);font-size:15px;box-shadow:0 3px 10px rgba(110,70,40,.2);animation:float 2.2s ease-in-out infinite}
.tg .e{display:none;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:rgba(255,250,243,.94);font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 3px 12px rgba(110,70,40,.2)}
.tg.edge .b{display:none} .tg.edge .e{display:flex}
.tg.hide{opacity:0;pointer-events:none}
.tg .e i{font-style:normal;color:var(--coral-d);font-size:14px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.ftext{position:absolute;left:0;top:0;font-size:24px;font-weight:800;color:#fff;white-space:nowrap;-webkit-text-stroke:1px rgba(150,80,40,.25);text-shadow:0 3px 0 var(--coral),0 6px 14px rgba(150,80,40,.3);will-change:transform,opacity}
.ftext.cool{text-shadow:0 3px 0 var(--mint),0 6px 14px rgba(40,110,90,.3)}

/* 하단: 퀵 시점 + 사장님 아이콘 */
#bar{position:fixed;z-index:18;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;transition:opacity .3s,right .35s}
#bar>*{pointer-events:auto}
.quick{display:flex;gap:6px;padding:6px;border-radius:18px}
.quick button{height:38px;padding:0 13px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink);transition:background .2s,transform .12s}
.quick button:hover{background:rgba(255,230,163,.6)}
.quick button.on{background:var(--butter);box-shadow:inset 0 -2px 0 rgba(160,110,30,.18)}
.quick button:active{transform:scale(.95)}
#face{width:56px;height:56px;border-radius:50%;background:var(--butter);font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(160,100,30,.25),inset 0 -3px 0 rgba(160,110,30,.18);transition:transform .15s}
#face:active{transform:scale(.92)}
#face.wiggle{animation:wig .6s ease}
@keyframes wig{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
#bubble{position:fixed;z-index:19;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);max-width:250px;padding:12px 14px;border-radius:18px 18px 6px 18px;background:#fffaf2;font-size:13.5px;line-height:1.55;box-shadow:0 8px 24px rgba(110,70,40,.2);opacity:0;transform:translateY(8px) scale(.95);transform-origin:100% 100%;transition:all .25s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#bubble.show{opacity:1;transform:none}
#bubble b{color:var(--coral-d)}
#hint{position:fixed;z-index:17;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);font-size:12.5px;color:var(--ink);background:rgba(255,250,243,.82);padding:7px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 12px rgba(110,70,40,.12);pointer-events:none;transition:opacity .5s}
#hint.gone{opacity:0}
body.panel-open #hint{opacity:0}

/* 패널 */
#panel{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 80px);right:16px;bottom:16px;width:360px;border-radius:24px;display:flex;flex-direction:column;background:rgba(255,250,243,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 50px rgba(110,70,40,.22);
  transform:translateX(calc(100% + 30px));opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1.05),opacity .3s}
#panel.open{transform:none;opacity:1}
.grab{display:none}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 8px}
.ptag{display:inline-block;font-size:11px;font-weight:700;color:var(--coral-d);background:rgba(239,138,116,.13);padding:3px 8px;border-radius:999px;margin-bottom:6px}
.phead h2{font-size:19px;font-weight:800}
#pClose{width:36px;height:36px;flex:none;border-radius:12px;background:rgba(120,88,60,.07);font-size:15px}
.pbody{flex:1;overflow:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.card{border-radius:14px;padding:9px 8px 8px;background:#fff;box-shadow:0 2px 8px rgba(110,70,40,.07);min-width:0}
.card:nth-child(1){background:#fff3d6}.card:nth-child(2){background:#ffe9e1}.card:nth-child(3){background:#e5f6ef}
.card span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.card b{display:block;font-size:13px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{margin:6px 0 16px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#e5f6ef,#fff7e2)}
.big span{font-size:12px;color:var(--muted)}
.big b{display:block;font-size:27px;font-weight:800;margin-top:2px}
.big em{font-style:normal;font-size:12px;color:var(--muted)}
.sec{font-size:12px;font-weight:700;color:var(--muted);margin:4px 2px 6px;display:flex;justify-content:space-between}
.rows{background:#fff;border-radius:16px;padding:2px 12px;box-shadow:0 2px 8px rgba(110,70,40,.06)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .l{display:flex;align-items:center;gap:8px;min-width:0}
.row .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12px;color:var(--muted);white-space:nowrap}
.row b{font-weight:700;white-space:nowrap}
.row.new{animation:rowin .9s ease}
@keyframes rowin{from{background:rgba(255,230,163,.8)}to{background:transparent}}
.row.total b{font-size:16px;font-weight:800}
.row b.pos{color:var(--pos)} .row b.neg{color:var(--neg)}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-매장{background:#e5f6ef;color:#2c8a6e}.c-배달{background:#ffe9e1;color:#c85a43}.c-예약{background:#efe8fb;color:#7a5fc0}
.empty{font-size:13px;color:var(--muted);padding:14px 0}
.primary{width:100%;margin-top:14px;height:50px;border-radius:16px;background:var(--coral);color:#fff;font-size:15.5px;font-weight:800;box-shadow:inset 0 -3px 0 rgba(150,60,40,.2),0 6px 16px rgba(239,138,116,.3);transition:transform .12s}
.primary:active{transform:scale(.97)}
.form{margin-top:14px;padding:14px;border-radius:18px;background:#fff;box-shadow:0 2px 10px rgba(110,70,40,.08);animation:fin .3s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.form label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
.form .field{margin-bottom:12px}
.form input{width:100%;height:48px;border-radius:13px;border:2px solid #f1e4d4;background:#fffaf3;padding:0 12px;font-size:18px;font-weight:700;outline:none;transition:border-color .2s}
.form input:focus{border-color:var(--coral)}
.form input.err{border-color:var(--neg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0;height:38px;border-radius:11px;background:#f7efe4;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--butter);color:var(--ink);box-shadow:inset 0 -2px 0 rgba(160,110,30,.18)}
.qk{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qk button{height:30px;padding:0 10px;border-radius:9px;background:#f7efe4;font-size:12px;font-weight:700;color:var(--ink)}
.factions{display:flex;gap:8px;margin-top:4px}
.factions button{flex:1;height:46px;border-radius:13px;font-size:15px;font-weight:800}
.factions .save{background:var(--mint);color:#fff;box-shadow:inset 0 -3px 0 rgba(20,80,60,.2)}
.factions .cancel{background:#f7efe4;color:var(--muted)}
.hintp{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55}
.reset{display:block;margin:14px auto 0;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:8px;text-decoration:underline;text-underline-offset:3px}
.reset.warn{color:var(--coral-d)}

.heart{position:absolute;left:0;top:0;font-size:20px;pointer-events:none;opacity:0;will-change:transform,opacity;animation:heartUp var(--d,1.3s) ease-out var(--dl,0s) forwards}
@keyframes heartUp{0%{opacity:0;transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(.3)}18%{opacity:1;transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) translate(-50%,-50%) scale(.85) rotate(var(--r))}}
#catBubble{position:absolute;left:0;top:0;padding:7px 12px;border-radius:16px 16px 16px 6px;background:#fffaf2;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px rgba(110,70,40,.18);opacity:0;transition:opacity .2s;will-change:transform}
#catBubble.show{opacity:1}
button,.tg,#hud,#bar{touch-action:manipulation}
.pbody{overscroll-behavior:contain}
body{-webkit-touch-callout:none}
@media (min-width:720px){
  body.panel-open #hud{right:392px}
  body.panel-open #bar{right:392px}
  body.panel-open #face,body.panel-open #bubble{opacity:0;pointer-events:none}
}
@media (max-width:719px){
  #hud{grid-template-columns:1fr;gap:6px;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px)}
  .mark{font-size:11px;padding:4px 9px}
  .hudbar{padding:5px 5px 5px 2px;border-radius:15px}
  .stat{padding:0 8px;flex:1 1 0}
  .stat span{font-size:10px}
  .stat b{font-size:13.5px}
  .homebtn{height:34px;padding:0 10px;font-size:15px}
  .homebtn em{display:none}
  #bar{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);justify-content:center}
  .quick{padding:5px;gap:4px}
  .quick button{height:36px;padding:0 10px;font-size:12.5px}
  #face{width:50px;height:50px;font-size:25px}
  #bubble{right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);max-width:230px}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 72px);font-size:12px}
  body.panel-open #bar,body.panel-open #bubble{opacity:0;pointer-events:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:58vh;max-height:58dvh;border-radius:26px 26px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .grab{display:block;width:40px;height:5px;border-radius:5px;background:rgba(120,88,60,.18);margin:8px auto 0}
  .phead{padding:8px 14px 6px}
  .phead h2{font-size:17px}
  .pbody{padding:2px 14px 16px}
  .big b{font-size:23px}
}
@media (max-width:350px){ .stat b{font-size:12.5px} .stat{padding:0 6px} .quick button{padding:0 8px;font-size:12px} }
@media (prefers-reduced-motion:reduce){ .tg .b,.blob{animation:none} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage" aria-label="1인칭 3D 매장 카운터"></div>

<header id="hud">
  <div class="mark"><i></i>솔로운영 3D</div>
  <div class="hudbar glass" role="group" aria-label="이번 달 요약">
    <div class="stat"><span>총매출</span><b id="hSales" class="num">₩0</b></div>
    <div class="stat"><span>지출</span><b id="hExp" class="num">₩0</b></div>
    <div class="stat"><span>순익</span><b id="hNet" class="num">₩0</b></div>
    <button id="homeBtn" class="homebtn" type="button" aria-label="내 자리로" title="내 자리로">🔄<em>내 자리로</em></button>
  </div>
</header>

<div id="tags"></div>
<div id="fx"><div id="catBubble" role="status" aria-live="polite"></div></div>
<div id="xh" aria-hidden="true"><div class="ring"></div><div class="dot"></div><div id="chip"></div></div>
<div id="hint">드래그로 둘러보고, 가운데 ◎로 겨눠서 탭!</div>

<div id="bar">
  <div class="quick glass" role="group" aria-label="빠른 시점">
    <button type="button" data-view="pos">포스 앞</button>
    <button type="button" data-view="fridge">냉장고 앞</button>
    <button type="button" data-view="seat" class="on">내 자리</button>
  </div>
  <button id="face" type="button" aria-label="사장님에게 말 걸기">🧑‍🍳</button>
</div>
<div id="bubble" role="status" aria-live="polite"></div>

<aside id="panel" role="dialog" aria-hidden="true" aria-labelledby="pTitle">
  <div class="grab"></div>
  <div class="phead"><div><div class="ptag" id="pTag"></div><h2 id="pTitle"></h2></div><button id="pClose" type="button" aria-label="패널 닫기">✕</button></div>
  <div class="pbody" id="pBody"></div>
</aside>

<div id="loader"><div class="blob"></div><p>솔로운영 3D 불러오는 중…</p></div>
<div id="fallback" hidden><b>3D 화면을 열 수 없어요</b><p id="fallbackMsg">이 기기·브라우저는 WebGL(3D 그래픽)을 지원하지 않아요.<br>최신 크롬·사파리·삼성 인터넷에서 다시 열어 주세요.</p></div>

<script>
(function(){
  var ok = false;
  try { var c = document.createElement('canvas'); ok = !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) {}
  function fail(msg){
    var l = document.getElementById('loader'); if (l) l.hidden = true;
    var f = document.getElementById('fallback'); if (f) f.hidden = false;
    if (msg) document.getElementById('fallbackMsg').innerHTML = msg;
  }
  window.__solo3dFail = fail;
  if (!ok) { window.__solo3dNoGL = true; fail(); return; }
  setTimeout(function(){ if (!window.__solo3dStarted) fail('3D 엔진을 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.'); }, 15000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

if (!window.__solo3dNoGL) {
window.__solo3dStarted = true;

/* =========================================================
   1. 데이터 (localStorage: solo3d_v1)

    if (now - sampleArm > 3000) { sampleArm = now; b.textContent = '한 번 더 누르면 샘플로 되돌려요'; b.classList.add('warn'); return; }
    sampleArm = 0; DATA = makeSample(); saveData(DATA); syncFridgeItems(); refreshPos(); renderHud(true); renderPanel();
  }
});

/* ---- 냉장고 문 / 금고 서랍 ---- */
const an = { door: 0, df: 0, dt: 0, ds: 0, drw: 0, wf: 0, wt: 0, ws: 0 }; let sparkleAt = 0;
function fridgeOpen(on) { an.df = an.door; an.dt = on ? 1 : 0; an.ds = performance.now(); if (on) sparkleAt = performance.now() + (RM ? 0 : 380); }
function drawerOpen(on) { an.wf = an.drw; an.wt = on ? 1 : 0; an.ws = performance.now(); }
function stepAnims(now) {
  const op = an.dt > an.df, td = Math.min(1, (now - an.ds) / (op ? 800 : 600));
  an.door = an.df + (an.dt - an.df) * (op ? easeBack(td) : easeIO(td));
  const a = 1.9 * an.door; doorL.rotation.y = -a; doorR.rotation.y = a;
  const lit = THREE.MathUtils.clamp(an.door, 0, 1); fridgeLight.intensity = 3.5 * lit; fInner.emissiveIntensity = 0.45 * lit;
  if (sparkleAt && now >= sparkleAt) { fridgeItems.forEach((g, j) => { g.userData.popT = now + j * 55; }); sparkleAt = 0; }
  const tw = Math.min(1, (now - an.ws) / 650);
  an.drw = an.wf + (an.wt - an.wf) * (an.wt > an.wf ? easeBack(tw) : easeIO(tw));
  drawer.position.z = 0.17 + 0.17 * an.drw;
  fridgeItems.forEach(g => {
    const u = g.userData; let s = 1, ei = 0; g.position.y = u.baseY;
    if (u.spawnT > 0) {
      const t = (now - u.spawnT) / 650;
      if (t >= 1) { u.spawnT = -1; u.popT = now; }
      else { const e = Math.max(0, t); s = Math.max(0.001, easeBack(e)); g.position.y = u.baseY + (1 - easeOut(e)) * 0.25; ei = 0.6 * (1 - e); }
    }
    if (u.spawnT < 0 && u.popT > 0) {
      const t = (now - u.popT) / 520;
      if (t >= 0 && t < 1) { s = 1 + 0.22 * Math.sin(Math.PI * t); ei = 0.7 * (1 - t); g.position.y = u.baseY + 0.04 * Math.sin(Math.PI * t); }
      else if (t >= 1) u.popT = -1;
    }
    g.scale.setScalar(s); u.mat.emissiveIntensity = ei;
  });
}

/* ---- 사장님 말 걸기 ---- */
const bubble = document.getElementById('bubble'), face = document.getElementById('face'); let bubbleTimer = 0;
function ownerTalk() {
  const mo = month();
  const quip = mo.net > 0 ? '이번 달은 흑자예요! 😄' : mo.net < 0 ? '아직 적자… 조금만 더 힘내요! 💪' : '딱 본전이에요! 🙂';
  const todayLine = mo.today > 0 ? `오늘 매출 <b>${won(mo.today)}</b> 🎉` : '오늘은 아직 매출이 없어요. 포스기에서 첫 매출 넣어볼까요?';
  bubble.innerHTML = `${todayLine}<br>이번 달 순익 <b>${won(mo.net)}</b><br>${quip}`;
  bubble.classList.add('show'); clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 4500);
  face.classList.remove('wiggle'); void face.offsetWidth; face.classList.add('wiggle');
  waveT = performance.now();
}
face.addEventListener('click', () => { firstUse(); ownerTalk(); });

/* =========================================================
   9. 배지 / 화면 밖 방향 표시
   ========================================================= */
const tagsEl = document.getElementById('tags');
Object.entries(OBJ).forEach(([k, o]) => {
  const el = document.createElement('button'); el.type = 'button'; el.className = 'tg';
  el.innerHTML = `<span class="b">${o.emoji}</span><span class="e"><span class="ee"></span>${o.emoji} ${o.name}</span>`;
  el.setAttribute('aria-label', o.name + ' 보기');
  el.addEventListener('click', e => { e.stopPropagation(); firstUse(); if (el.classList.contains('edge')) { if (o.focus) setView(k); else lookAt(o.anchor); } else interact(k); });
  tagsEl.appendChild(el); o.el = el; o.arrow = el.querySelector('.ee');
});
function lookAt(p) { const yp = lookYP(cam.pos, p); moveTo({ pos: cam.pos.clone(), yaw: yp.yaw, pitch: THREE.MathUtils.clamp(yp.pitch, -PITCH_LIM, PITCH_LIM) }, 0.6); }
const tmpV = new THREE.Vector3(), tmpF = new THREE.Vector3();
function updateOverlays(now) {
  const hb = document.getElementById('hud').getBoundingClientRect().bottom + 10;
  const barEl = document.getElementById('bar'), bt = (innerWidth < 720 && document.body.classList.contains('panel-open')) ? innerHeight - panel.offsetHeight : barEl.getBoundingClientRect().top - 10;
  camera.getWorldDirection(tmpF);
  Object.entries(OBJ).forEach(([k, o]) => {
    if (activeKey || camTween) { o.el.classList.add('hide'); return; }
    tmpV.copy(o.anchor).project(camera);
    const behind = o.anchor.clone().sub(camera.position).dot(tmpF) < 0;
    let x = tmpV.x, y = tmpV.y; if (behind) { x = -x; y = -y; }
    const sx = (x * 0.5 + 0.5) * innerWidth, sy = (-y * 0.5 + 0.5) * innerHeight;
    const inView = !behind && sx > 20 && sx < innerWidth - 20 && sy > hb && sy < bt;
    o.el.classList.toggle('hide', aimKey === k && inView);
    if (inView) {
      o.el.classList.remove('edge');
      o.el.style.transform = `translate3d(${sx.toFixed(1)}px,${sy.toFixed(1)}px,0) translate(-50%,-100%)`;
    } else {
      o.el.classList.add('edge');
      // 화면 중심에서 그 방향으로 가장자리까지
      const cx = innerWidth / 2, cy = innerHeight / 2; let dx = sx - cx, dy = sy - cy;
      if (behind || Math.abs(dx) + Math.abs(dy) < 1) { dx = (x >= 0 ? 1 : -1) * 1000; dy = 0; }
      const w = o.el.offsetWidth || 90, h = o.el.offsetHeight || 30;
      const minX = 8 + w / 2, maxX = innerWidth - 8 - w / 2, minY = hb + h / 2, maxY = bt - h / 2;
      const sc = Math.min(dx > 0 ? (maxX - cx) / dx : dx < 0 ? (minX - cx) / dx : Infinity, dy > 0 ? (maxY - cy) / dy : dy < 0 ? (minY - cy) / dy : Infinity);
      const ex = THREE.MathUtils.clamp(cx + dx * sc, minX, maxX), ey = THREE.MathUtils.clamp(cy + dy * sc, minY, maxY);
      const arrow = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? '▶' : '◀') : (dy > 0 ? '▼' : '▲');
      o.arrow.innerHTML = `<i>${arrow}</i>`;
      if (dx > 0 && Math.abs(dx) > Math.abs(dy)) o.arrow.parentNode.appendChild(o.arrow); else o.arrow.parentNode.insertBefore(o.arrow, o.arrow.parentNode.firstChild);
      o.el.style.transform = `translate3d(${ex.toFixed(1)}px,${ey.toFixed(1)}px,0) translate(-50%,-50%)`;
    }
  });
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i], t = (now - f.s) / f.d;
    if (t >= 1) { f.el.remove(); floats.splice(i, 1); continue; }
    tmpV.copy(f.p); tmpV.y += easeOut(t) * 0.35; tmpV.project(camera);
    const sc = t < 0.15 ? 0.6 + t / 0.15 * 0.5 : 1.1 - (t - 0.15) * 0.15;
    f.el.style.transform = `translate3d(${(tmpV.x * 0.5 + 0.5) * innerWidth}px,${(-tmpV.y * 0.5 + 0.5) * innerHeight}px,0) translate(-50%,-50%) scale(${sc})`;
    f.el.style.opacity = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
  }
}

/* =========================================================
   10. 입력: 드래그=고개 돌리기, 짧은 탭=상호작용, 조준
   ========================================================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const cv = renderer.domElement;
function pickAt(nx, ny) {
  ndc.set(nx, ny); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(PICKABLE, true);
  for (const h of hits) { let o = h.object; while (o && !o.userData.key) o = o.parent; if (o) return o.userData.key; }
  return null;
}
let drag = null, aimKey = null;
const SENS = COARSE ? 0.0058 : 0.0045;
cv.addEventListener('pointerdown', e => {
  if (drag) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), lt: performance.now(), moved: 0 };
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  vel.yaw = vel.pitch = 0;
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, now = performance.now(), dt = Math.max(1, now - drag.lt);
  drag.x = e.clientX; drag.y = e.clientY; drag.lt = now;
  drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy));
  if (drag.moved < 8) return; // 탭 판정 구간
  if (camTween) { camTween = null; document.body.classList.remove('moving'); }
  cv.classList.add('dragging'); firstUse(true);
  cam.yaw += dx * SENS; cam.pitch = THREE.MathUtils.clamp(cam.pitch + dy * SENS, -PITCH_LIM, PITCH_LIM);
  // 관성용 속도(라디안/초), 부드럽게 평균
  vel.yaw = vel.yaw * 0.6 + (dx * SENS / dt * 1000) * 0.4; vel.pitch = vel.pitch * 0.6 + (dy * SENS / dt * 1000) * 0.4;
});
function endDrag(e, cancel) {
  if (!drag || drag.id !== e.pointerId) return;
  const tap = !cancel && drag.moved < 8 && performance.now() - drag.t < 600;
  if (performance.now() - drag.lt > 80) vel.yaw = vel.pitch = 0;
  drag = null; cv.classList.remove('dragging');
  if (RM) vel.yaw = vel.pitch = 0;
  if (!tap) return;
  const r = cv.getBoundingClientRect();
  const k = pickAt(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1) || (activeKey ? null : aimKey);
  if (k) interact(k); else if (activeKey) closePanel();
}
cv.addEventListener('pointerup', e => endDrag(e, false));
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointercancel', e => endDrag(e, true));
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { closePanel(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && !activeKey && aimKey && document.activeElement === document.body) { e.preventDefault(); interact(aimKey); return; }
  const step = 0.09;
  if (e.key === 'ArrowLeft' || e.key === 'a') { cam.yaw += step; firstUse(true); }
  if (e.key === 'ArrowRight' || e.key === 'd') { cam.yaw -= step; firstUse(true); }
  if (e.key === 'ArrowUp' || e.key === 'w') cam.pitch = Math.min(PITCH_LIM, cam.pitch + step);
  if (e.key === 'ArrowDown' || e.key === 's') cam.pitch = Math.max(-PITCH_LIM, cam.pitch - step);
});
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { firstUse(); if (activeKey) { closePanel(); if (b.dataset.view === 'seat') return; } setView(b.dataset.view); }));
document.getElementById('homeBtn').addEventListener('click', () => { if (activeKey) closePanel(); else setView('seat'); });
const hintEl = document.getElementById('hint'); let used = { drag: false, tap: false };
function firstUse(isDrag) { if (isDrag) used.drag = true; else used.tap = true; if (used.drag && used.tap) hintEl.classList.add('gone'); }
setTimeout(() => hintEl.classList.add('gone'), 15000);

/* =========================================================
   11. 크기 변경 · 루프
   ========================================================= */
function applyCam() { camera.position.copy(cam.pos); camera.rotation.set(cam.pitch, cam.yaw, 0, 'YXZ'); }
function onResize() {
  renderer.setSize(innerWidth, innerHeight); setCameraFov(); updateShiftTarget();
  if (!activeKey && !camTween && view === 'seat') { const s = seatPose(); cam.pos.copy(s.pos); }
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

setCameraFov();
const seat0 = seatPose();
cam.pos.copy(seat0.pos); cam.yaw = seat0.yaw; cam.pitch = seat0.pitch;
if (!RM) { cam.pos.add(V3(0, 0.25, 0.5)); cam.yaw = 0.5; cam.pitch = 0.05; } // 들어오며 자리에 앉는 연출
applyCam();
syncFridgeItems(); refreshPos(); renderHud(RM);
const HL = new THREE.Color(0xffb08a);
const clock0 = { last: performance.now(), t: 0 }, perf = { n: 0, sum: 0, last: performance.now() };
let started = false;
function frame(now) {
  const dt = Math.min(0.05, (now - clock0.last) / 1000); clock0.last = now; clock0.t += dt; const T = clock0.t;

  if (camTween) {
    const t = Math.min(1, (now - camTween.s) / camTween.d), e = easeIO(t);
    cam.pos.lerpVectors(camTween.p0, camTween.p1, e); cam.yaw = camTween.y0 + camTween.dy * e; cam.pitch = camTween.pi0 + (camTween.pi1 - camTween.pi0) * e;
    if (t >= 1) { camTween = null; document.body.classList.remove('moving'); }
  } else if (!drag && (Math.abs(vel.yaw) > 0.002 || Math.abs(vel.pitch) > 0.002)) {
    cam.yaw += vel.yaw * dt; cam.pitch = THREE.MathUtils.clamp(cam.pitch + vel.pitch * dt, -PITCH_LIM, PITCH_LIM);
    const k = Math.exp(-dt * 5.5); vel.yaw *= k; vel.pitch *= k;
  }
  applyCam(); applyShift();

  // 조준 (화면 중앙 레이)
  const nk = (!activeKey && !camTween) ? pickAt(0, 0) : null;
  if (nk !== aimKey) {
    aimKey = nk; const xh = document.getElementById('xh');
    xh.classList.toggle('aim', !!nk);
    if (nk) document.getElementById('chip').innerHTML = `${OBJ[nk].emoji} ${OBJ[nk].name} · <small>${OBJ[nk].chip}</small>`;
  }
  // 하이라이트: 살짝 들뜨고 따뜻하게 빛남
  Object.entries(OBJ).forEach(([k, o]) => {
    const target = (aimKey === k || activeKey === k) ? 1 : 0;
    o.h += (target - o.h) * Math.min(1, dt * 10);
    o.root.position.y = o.baseY + o.h * (k === 'fridge' ? 0.012 : 0.025) + (k === 'owner' && !RM ? Math.abs(Math.sin(T * 2)) * 0.004 : 0);
    o.mats.forEach(m => { m.emissive.copy(m.userData.baseEm).lerp(HL, o.h * 0.35); m.emissiveIntensity = Math.max(m.userData.baseEI, o.h * 0.32); });
  });
  screenGlow = Math.max(0, screenGlow - dt * 0.9);
  screenMat.emissiveIntensity = 0.62 + screenGlow * 1.2 + OBJ.pos.h * 0.15;
  // 인형: 숨쉬기 + 손 흔들기
  if (!RM) { doll.scale.y = 1 + Math.sin(T * 2.2) * 0.015; dhead.rotation.z = Math.sin(T * 1.1) * 0.05; }
  if (waveT > 0) {
    const t = (now - waveT) / 1600;
    if (t >= 1) { waveT = -1; dArmR.rotation.z = 0.2; doll.position.y = 0; }
    else { const up = t < 0.15 ? easeOut(t / 0.15) : t > 0.85 ? 1 - easeIO((t - 0.85) / 0.15) : 1; dArmR.rotation.z = 0.2 + up * (2.3 + Math.sin(t * 30) * 0.4); doll.position.y = Math.abs(Math.sin(t * Math.PI * 3)) * 0.03 * (1 - t); }
  }
  // 시계
  const k0 = kst(); hourH.rotation.z = -((+k0.time.slice(0, 2) % 12) + (+k0.time.slice(3)) / 60) / 12 * Math.PI * 2; minH.rotation.z = -(+k0.time.slice(3)) / 60 * Math.PI * 2;
  hourH.position.set(Math.sin(-hourH.rotation.z) * 0.045, Math.cos(hourH.rotation.z) * 0.045, 0.03); minH.position.set(Math.sin(-minH.rotation.z) * 0.07, Math.cos(minH.rotation.z) * 0.07, 0.035);

  if (perf.n < 90 && started) { perf.sum += now - perf.last; perf.n++; if (perf.n === 90 && perf.sum / 90 > 22 && renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); } }
  perf.last = now;
  stepCat(now, T, dt); stepAnims(now); updateParts(dt); stepHud(now);
  renderer.render(scene, camera);
  updateOverlays(now);

  if (!started) {
    started = true;
    document.getElementById('loader').classList.add('hide'); stage.classList.add('ready');
    setTimeout(() => { document.getElementById('loader').hidden = true; }, 700);
    if (!RM) { moveTo(seatPose(), 1.6); setTimeout(() => renderHud(true), 500); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__solo3d = { info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, dpr: renderer.getPixelRatio(), geos: renderer.info.memory.geometries }) };
}
</script>
